[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphmovie"
version = "0.1.0"
description = "Production LangGraph case for AI movie and video production planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
]
llm = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langsmith>=0.1",
]
worker = [
  "celery[redis]>=5.4",
  "redis>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
graphmovie = "graphmovie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["graphmovie"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
