services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: graphmovie
      POSTGRES_PASSWORD: graphmovie
      POSTGRES_DB: graphmovie
    ports:
      - "5432:5432"
    volumes:
      - graphmovie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphmovie -d graphmovie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  graphmovie_pg:
