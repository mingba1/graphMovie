name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra worker

      - name: Run tests
        env:
          CELERY_TASK_ALWAYS_EAGER: "1"
          GRAPHMOVIE_CELERY_EAGER: "1"
          GRAPHMOVIE_API_KEYS: ""
          GRAPHMOVIE_RATE_LIMIT_PER_MINUTE: "0"
        run: uv run pytest
